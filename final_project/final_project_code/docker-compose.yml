version: '3.8'

services:
  # 1. 后端服务
  ai-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  # 2. Redis 数据库
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 3. 前端网页
  frontend:
    build: 
      context: .
      dockerfile: Dockerfile_frontend  # 如果你放在同一个目录，就用这个名字区分
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://ai-api:8000/chat # 注意这里，Docker 内部通信用服务名
    depends_on:
      - ai-api