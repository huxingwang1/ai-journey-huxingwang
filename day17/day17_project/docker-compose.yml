version: '3.8'

services:
  # 服务1：AI Agent API
  ai-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    dns:
      - 114.114.114.114
      - 8.8.8.8
    depends_on:
      - redis
# 服务2：Redis
  redis:
    image: redis:7-alpine       # 官方轻量级 Redis 镜像
    ports:
      - "6379:6379"